[project]
name = "handwrite-simulator"
version = "0.3.0"
description = "手写模拟器 - 基于 handright 的手写体生成工具（GUI + CLI）"
requires-python = ">=3.12"
dependencies = [
    "handright==8.2.0",
    "img2pdf>=0.6.3",
    "numpy>=2.5.1",
    "pillow>=11,<13",
    "PyQt6>=6.6",
    "pypdfium2>=4.30",
    "python-docx>=1.2.0",
    "scipy>=1.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.scripts]
handwrite-gui = "handwritesim.app:main"
handwrite-cli = "handwritesim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handwritesim"]

# uv 依赖覆盖：handright 8.2.0 声明 pillow<11，但实测其 API 兼容新版 pillow，
# 这里强制使用支持 Python 3.14 的 pillow 版本（纯 Python 依赖无二进制兼容问题）。
[tool.uv]
package = true
override-dependencies = ["pillow>=11,<13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
