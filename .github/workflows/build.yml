name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: HandWriteSim-windows-x86_64
            exe_name: HandWriteSim.exe
          - os: ubuntu-latest
            artifact: HandWriteSim-linux-x86_64
            exe_name: HandWriteSim
          - os: macos-latest
            artifact: HandWriteSim-macos-arm64
            exe_name: HandWriteSim
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        # 固定 Python 3.12：PyQt6/numpy/scipy 在 Windows/macOS/Linux 均有
        # 预编译 wheel，避免新 Python 版本（如 3.14）在部分平台无包导致首次构建失败
        run: |
          uv python install 3.12
          uv sync --extra dev --python 3.12

      - name: Build (PyInstaller onefile)
        run: uv run --python 3.12 --extra dev pyinstaller --noconfirm --clean HandWriteSim.spec

      # macOS 可执行文件需 ad-hoc 签名，否则 Gatekeeper 会拦截
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - "dist/${{ matrix.exe_name }}"

      # 组装便携包：exe + 预设 + 背景(webp) + 空 fonts 目录（用户自备字体）
      # 同时产出单文件 exe（老用户升级直接替换旧 exe，应用内自动更新优先使用）
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "staging/fonts", "staging/backgrounds", "staging/presets" | Out-Null
          Copy-Item -Recurse "backgrounds/*" "staging/backgrounds/"
          Copy-Item -Recurse "presets/*" "staging/presets/"
          Copy-Item "dist/${{ matrix.exe_name }}" "staging/"
          Copy-Item "packaging/fonts-README.txt" "staging/fonts/README.txt"
          Compress-Archive -Path "staging/*" -DestinationPath "${{ matrix.artifact }}.zip" -Force
          Copy-Item "dist/${{ matrix.exe_name }}" "${{ matrix.artifact }}.exe"

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          mkdir -p staging/fonts staging/backgrounds staging/presets
          cp -r backgrounds/. staging/backgrounds/
          cp -r presets/. staging/presets/
          cp "dist/${{ matrix.exe_name }}" staging/
          cp packaging/fonts-README.txt staging/fonts/README.txt
          cd staging
          zip -r "../${{ matrix.artifact }}.zip" .
          cd ..
          # 单文件升级包：老用户直接替换旧二进制即可
          cp "dist/${{ matrix.exe_name }}" "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

      # 单文件版：老用户升级无需下载整包，直接替换旧二进制即可
      - name: Upload single-file exe (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-exe
          path: ${{ matrix.artifact }}.exe
          if-no-files-found: error

      - name: Upload single-file binary (Linux / macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-exe
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 需要完整历史来计算与上一版本 tag 之间的提交差异
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
            printf '## 更新内容\n\n自上一版本 **%s** 以来的变更：\n\n' "${PREV}" > release-notes.md
          else
            RANGE="${TAG}"
            printf '## 更新内容\n\n首个自动发布版本，包含以下提交：\n\n' > release-notes.md
          fi
          git log --no-merges --pretty=format:"- %s" "${RANGE}" >> release-notes.md
          printf '\n\n' >> release-notes.md
          if [ -n "$PREV" ]; then
            printf '▶ [查看完整提交记录](%s)\n\n' "https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}" >> release-notes.md
          fi
          # 下载说明模板：{TAG} 占位符替换为实际 tag，产物链接即指向本版资产
          sed "s/{TAG}/${TAG}/g" packaging/release-body.md >> release-notes.md
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          # 每个 artifact 均为单文件：3 平台 zip + 3 平台单文件
          files: artifacts/**/*
          body_path: release-notes.md
