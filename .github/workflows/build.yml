name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: HandWriteSim-windows-x86_64
            exe_name: HandWriteSim.exe
          - os: ubuntu-latest
            artifact: HandWriteSim-linux-x86_64
            exe_name: HandWriteSim
          - os: macos-latest
            artifact: HandWriteSim-macos-arm64
            exe_name: HandWriteSim
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        # 固定 Python 3.12：PyQt6/numpy/scipy 在 Windows/macOS/Linux 均有
        # 预编译 wheel，避免新 Python 版本（如 3.14）在部分平台无包导致首次构建失败
        run: |
          uv python install 3.12
          uv sync --extra dev --python 3.12

      - name: Build (PyInstaller onefile)
        run: uv run --python 3.12 --extra dev pyinstaller --noconfirm --clean HandWriteSim.spec

      # macOS 可执行文件需 ad-hoc 签名，否则 Gatekeeper 会拦截
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - "dist/${{ matrix.exe_name }}"

      # 组装便携包：exe + 预设 + 背景(webp) + 空 fonts 目录（用户自备字体）
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "staging/fonts", "staging/backgrounds", "staging/presets" | Out-Null
          Copy-Item -Recurse "backgrounds/*" "staging/backgrounds/"
          Copy-Item -Recurse "presets/*" "staging/presets/"
          Copy-Item "dist/${{ matrix.exe_name }}" "staging/"
          Copy-Item "packaging/fonts-README.txt" "staging/fonts/README.txt"
          Compress-Archive -Path "staging/*" -DestinationPath "${{ matrix.artifact }}.zip" -Force

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          mkdir -p staging/fonts staging/backgrounds staging/presets
          cp -r backgrounds/. staging/backgrounds/
          cp -r presets/. staging/presets/
          cp "dist/${{ matrix.exe_name }}" staging/
          cp packaging/fonts-README.txt staging/fonts/README.txt
          cd staging
          zip -r "../${{ matrix.artifact }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 需要完整历史来计算与上一版本 tag 之间的提交差异
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
            printf '## 更新内容\n\n自上一版本 **%s** 以来的变更：\n\n' "${PREV}" > release-notes.md
          else
            RANGE="${TAG}"
            printf '## 更新内容\n\n首个自动发布版本，包含以下提交：\n\n' > release-notes.md
          fi
          git log --no-merges --pretty=format:"- %s" "${RANGE}" >> release-notes.md
          printf '\n\n' >> release-notes.md
          if [ -n "$PREV" ]; then
            printf '▶ [查看完整提交记录](%s)\n\n' "https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}" >> release-notes.md
          fi
          cat >> release-notes.md <<'EOF'
          ## 下载说明
          
          每个平台提供一个**便携 zip**（内含单文件可执行程序）：
          - `HandWriteSim-windows-x86_64.zip`：Windows 版（内含 `HandWriteSim.exe`）
          - `HandWriteSim-linux-x86_64.zip`：Linux 版
          - `HandWriteSim-macos-arm64.zip`：macOS（Apple Silicon）版
          
          解压后即可使用（无需安装）：可执行文件 + `presets/` 预设 + `backgrounds/` 背景 + `fonts/` 字体目录。
          首次运行会自动创建缺失的 `fonts/`、`backgrounds/`、`presets/` 目录，整个文件夹可随意拷贝到任意位置。
          
          ### 为什么没有字体？
          
          手写体字体多为商业版权字体（如汉呈、华阳、云江等字库），开源分发需要授权，
          因此本仓库与发布包均**不包含字体文件**。
          
          请自备字体放入 `fonts/` 目录，或从开源 / 免费可商用字体中下载：
          - 霞鹜文楷（LXGW WenKai）：OFL 1.1 协议，可商用，最接近手写体观感
          - 沐瑶随心手写体 / 站酷小薇 / 站酷快乐体：免费可商用
          
          预设中的字体路径（如 `fonts/云烟体.ttf`）为占位名称，
          放入对应字体文件后即可直接使用，也可以改用其他字体。
          EOF
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          body_path: release-notes.md
